services:
  app:
    build: .
    image: wheretonext:latest
    ports:
      - "8000:8000"
    environment:
      # Passed through from your shell or .env; the app runs without it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WTN_ENVIRONMENT: prod
      WTN_LOG_LEVEL: INFO
      WTN_DATABASE_URL: sqlite+aiosqlite:////data/wheretonext.db
    volumes:
      - itineraries:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  itineraries:
